<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
  <title>RACSA | Asistencia</title>
  <link rel="icon" type="image/png" href="imagenes/logo1.png">

  <style>
    :root{
      --racsa-green: #04B005;
      --racsa-blue:  #0DA0D3;
      --bg: #ECEEED;
      --card: #ffffff;
      --text: #0f172a;
      --muted: rgba(15,23,42,.65);
      --radius: 18px;
      --shadow: 0 18px 50px rgba(0,0,0,.12);
    }

    *{ box-sizing: border-box; }

    html, body{ height: 100%; }

    body{
      margin: 0;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
    }

    .bg{
      position: fixed;
      inset: 0;
      background: radial-gradient(circle at top, rgba(13,160,211,.25), transparent 55%),
                  radial-gradient(circle at bottom, rgba(4,176,5,.20), transparent 55%),
                  linear-gradient(180deg, #f6f7f7, #ffffff);
      z-index: -1;
    }

    .wrap{
      min-height: 100%;
      display: grid;
      place-items: center;
      padding: 18px;
    }

    .card{
      width: 100%;
      max-width: 420px;
      background: var(--card);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      border: 1px solid rgba(0,0,0,.06);
      padding: 18px;
    }

    .brand{
      display: flex;
      align-items: center;
      gap: 14px;
      margin-bottom: 14px;
    }

    .logo{
      width: 56px;
      height: 56px;
      border-radius: 16px;
      object-fit: contain;
      background: rgba(4,176,5,.06);
      padding: 8px;
      border: 1px solid rgba(4,176,5,.10);
    }

    .brand-text h1{
      margin: 0;
      font-size: 18px;
      font-weight: 900;
    }

    .brand-text p{
      margin: 2px 0 0;
      font-size: 13px;
      color: var(--muted);
      font-weight: 700;
    }

    .form{
      display: grid;
      gap: 10px;
    }

    .label{
      font-size: 12px;
      font-weight: 900;
      color: rgba(15,23,42,.8);
    }

    .input{
      width: 100%;
      padding: 13px 14px;
      border-radius: 16px;
      border: 1px solid rgba(0,0,0,.12);
      outline: none;
      font-weight: 800;
      font-size: 14px;
    }

    .input:focus{
      border-color: var(--racsa-blue);
      box-shadow: 0 0 0 4px rgba(13,160,211,.16);
    }

    .btn{
      padding: 13px 14px;
      border-radius: 16px;
      font-weight: 900;
      font-size: 14px;
      border: none;
      cursor: pointer;
      transition: transform .08s ease, opacity .2s ease;
    }

    .btn:active{ transform: scale(.98); }

    .btn-primary{
      background: linear-gradient(90deg, var(--racsa-green), var(--racsa-blue));
      color: #fff;
    }

    .btn-outline{
      background: transparent;
      border: 2px solid rgba(4,176,5,.55);
      color: var(--racsa-green);
    }

    .msg{
      min-height: 18px;
      font-weight: 900;
      font-size: 13px;
      padding-top: 6px;
    }

    .msg.ok{ color: var(--racsa-green); }
    .msg.err{ color: #dc2626; }

    .foot{
      margin-top: 14px;
      font-size: 12px;
      color: rgba(15,23,42,.55);
      font-weight: 800;
      text-align: center;
    }
  </style>
</head>

<body>
  <div class="bg"></div>

  <main class="wrap">
    <section class="card">
      <div class="brand">
        <img src="imagenes/logo1.png" class="logo" alt="RACSA">
        <div class="brand-text">
          <h1>Asistencia RACSA</h1>
          <p>Ingresa con tu cuenta para registrar entrada y salida</p>
        </div>
      </div>

      <form id="formLogin" class="form">
        <label class="label">Correo</label>
        <input id="email" class="input" type="email" placeholder="correo@racsa.com" autocomplete="email" required>

        <label class="label">Contraseña</label>
        <input id="password" class="input" type="password" placeholder="••••••••" autocomplete="current-password" required>

        <button id="btnLogin" class="btn btn-primary" type="submit">Iniciar sesión</button>
        <button id="btnReset" class="btn btn-outline" type="button">Olvidé mi contraseña</button>

        <div id="msg" class="msg"></div>
      </form>
    </section>

    <footer class="foot">
      <span>RACSA · Control de asistencia</span>
    </footer>
  </main>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import { getAuth, signInWithEmailAndPassword, sendPasswordResetEmail, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
    import { getDatabase, ref, get } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBZLk6DfCrt0TmWthRTFoN4JNb7x3FBY-Y",
      authDomain: "racsa-rg.firebaseapp.com",
      databaseURL: "https://racsa-rg-default-rtdb.firebaseio.com",
      projectId: "racsa-rg",
      storageBucket: "racsa-rg.firebasestorage.app",
      messagingSenderId: "348973311556",
      appId: "1:348973311556:web:72cf47c70fc1b6bea7be11"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getDatabase(app);

    const formLogin = document.getElementById("formLogin");
    const email = document.getElementById("email");
    const password = document.getElementById("password");
    const btnLogin = document.getElementById("btnLogin");
    const btnReset = document.getElementById("btnReset");
    const msg = document.getElementById("msg");

    function setMsg(text, type = "") {
      msg.textContent = text;
      msg.className = "msg " + type;
    }

    async function getUserRole(uid) {
      const snap = await get(ref(db, `usuarios/${uid}`));
      if (!snap.exists()) return null;
      const data = snap.val();
      return data.rol || null;
    }

    function goToPanel() {
      window.location.href = "panel.html";
    }

    onAuthStateChanged(auth, async (user) => {
      if (!user) return;
      goToPanel();
    });

    formLogin.addEventListener("submit", async (e) => {
      e.preventDefault();
      setMsg("");

      const correo = email.value.trim();
      const pass = password.value.trim();

      if (!correo || !pass) {
        setMsg("Completa correo y contraseña.", "err");
        return;
      }

      btnLogin.disabled = true;
      btnLogin.style.opacity = ".7";

      try {
        const cred = await signInWithEmailAndPassword(auth, correo, pass);

        const rol = await getUserRole(cred.user.uid);
        if (!rol) {
          setMsg("Tu cuenta no tiene rol asignado. Contacta al administrador.", "err");
          return;
        }

        localStorage.setItem("racsa_uid", cred.user.uid);
        localStorage.setItem("racsa_rol", rol);

        goToPanel();
      } catch (error) {
        if (error.code === "auth/invalid-credential") setMsg("Correo o contraseña incorrectos.", "err");
        else if (error.code === "auth/too-many-requests") setMsg("Demasiados intentos. Intenta más tarde.", "err");
        else setMsg("Error al iniciar sesión.", "err");
      } finally {
        btnLogin.disabled = false;
        btnLogin.style.opacity = "1";
      }
    });

    btnReset.addEventListener("click", async () => {
      setMsg("");

      const correo = email.value.trim();
      if (!correo) {
        setMsg("Escribe tu correo para enviar el enlace de recuperación.", "err");
        return;
      }

      btnReset.disabled = true;
      btnReset.style.opacity = ".7";

      try {
        await sendPasswordResetEmail(auth, correo);
        setMsg("Listo. Revisa tu correo para restablecer tu contraseña.", "ok");
      } catch (error) {
        setMsg("No se pudo enviar el correo. Verifica el correo.", "err");
      } finally {
        btnReset.disabled = false;
        btnReset.style.opacity = "1";
      }
    });
  </script>
</body>
</html>
